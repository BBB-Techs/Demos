<title>TMA Hub Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: floating app shell. Quiet sidebar + bento workspace on desktop; top bar + bottom tab rail on phones.
   Design system from UI UX Pro Max: flat style, professional blue, deal green, Plus Jakarta Sans. */
:root{
  --bg:#f4f7fc; --surface:#ffffff; --surface-2:#f1f5fd; --surface-3:#e9eff9; --line:#e2e9f5; --line-2:#eef2f9;
  --ink:#0f172a; --ink-2:#475569; --ink-3:#7b8aa3;
  --accent:#2563eb; --accent-hover:#1d4fd8; --accent-ink:#ffffff; --accent-soft:#e7efff; --accent-2:#0ea5e9; --accent-glow:rgba(37,99,235,.18);
  --side:#ffffff; --side-2:#eef3fe; --side-ink:#475569; --side-strong:#0f172a; --side-act:#2563eb;
  --good:#047857; --good-soft:#dff7ec; --warn:#b45309; --warn-soft:#fdf1d8; --bad:#dc2626; --bad-soft:#fde8e8;
  --c1:#2563eb; --c2:#0891b2; --c3:#7c3aed; --c4:#d97706;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 1px 1px rgba(15,23,42,.03);
  --shadow-hover:0 8px 24px rgba(15,23,42,.08);
  --shadow-lg:0 24px 64px rgba(15,23,42,.20);
  --hero:linear-gradient(135deg,#2563eb 0%,#1e40af 55%,#0e7490 100%);
  --f-display:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px; --r-sm:10px; --ease:cubic-bezier(.2,.8,.2,1); --t:180ms;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#070b16; --surface:#0d1424; --surface-2:#121b2f; --surface-3:#18233b; --line:#1c2740; --line-2:#162036;
  --ink:#e8eefc; --ink-2:#a2b0cb; --ink-3:#6f7f9f;
  --accent:#5b8cff; --accent-hover:#7aa2ff; --accent-ink:#06102a; --accent-soft:#14234a; --accent-2:#38bdf8; --accent-glow:rgba(91,140,255,.25);
  --side:#0a1020; --side-2:#14214a; --side-ink:#94a3c4; --side-strong:#ffffff; --side-act:#8cb0ff;
  --good:#34d399; --good-soft:#0b2a20; --warn:#fbbf24; --warn-soft:#2e2309; --bad:#f87171; --bad-soft:#361314;
  --c1:#5b8cff; --c2:#22d3ee; --c3:#a78bfa; --c4:#fbbf24;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --shadow-hover:0 10px 28px rgba(0,0,0,.45);
  --shadow-lg:0 24px 64px rgba(0,0,0,.65);
  --hero:linear-gradient(135deg,#1e3a8a 0%,#172554 55%,#0c4a6e 100%);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#070b16; --surface:#0d1424; --surface-2:#121b2f; --surface-3:#18233b; --line:#1c2740; --line-2:#162036;
  --ink:#e8eefc; --ink-2:#a2b0cb; --ink-3:#6f7f9f;
  --accent:#5b8cff; --accent-hover:#7aa2ff; --accent-ink:#06102a; --accent-soft:#14234a; --accent-2:#38bdf8; --accent-glow:rgba(91,140,255,.25);
  --side:#0a1020; --side-2:#14214a; --side-ink:#94a3c4; --side-strong:#ffffff; --side-act:#8cb0ff;
  --good:#34d399; --good-soft:#0b2a20; --warn:#fbbf24; --warn-soft:#2e2309; --bad:#f87171; --bad-soft:#361314;
  --c1:#5b8cff; --c2:#22d3ee; --c3:#a78bfa; --c4:#fbbf24;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --shadow-hover:0 10px 28px rgba(0,0,0,.45);
  --shadow-lg:0 24px 64px rgba(0,0,0,.65);
  --hero:linear-gradient(135deg,#1e3a8a 0%,#172554 55%,#0c4a6e 100%);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background-color var(--t) var(--ease)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:28px;font-weight:800;line-height:1.15}
h2{font-size:16px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,select,a,[data-acct],[data-go],[data-so],[data-site]{cursor:pointer}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:700}

/* shell */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 16px;gap:24px;overflow-y:auto;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--hero);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.03em;box-shadow:0 6px 16px var(--accent-glow)}
.brand b{display:block;color:var(--side-strong);font-size:16px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.brand small{font-size:11.5px;color:var(--side-ink)}
.nav{display:flex;flex-direction:column;gap:20px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;padding:0 12px 6px;color:var(--ink-3);font-weight:700}
.nav a{display:flex;align-items:center;gap:12px;min-height:42px;padding:0 12px;border-radius:12px;color:var(--side-ink);text-decoration:none;font-weight:600;font-size:13.5px;transition:background-color var(--t) var(--ease),color var(--t) var(--ease)}
.nav a:hover{background:var(--surface-2);color:var(--side-strong)}
.nav a.on{background:var(--side-2);color:var(--side-act)}
.nav svg{width:19px;height:19px;flex:none}
.nav .badge{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px;font-weight:700}
.nav .badge.blue{background:var(--accent);color:var(--accent-ink)}
.side-foot{margin-top:auto;font-size:12px;padding:14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.side-foot b{color:var(--side-strong);font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:7px;box-shadow:0 0 0 3px var(--good-soft)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.search{flex:1;min-width:0;max-width:540px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px;color:var(--ink-3);transition:border-color var(--t),box-shadow var(--t)}
.search:hover{border-color:var(--ink-3)}
.search span.ph{flex:1;text-align:left;font-size:13.5px}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--ink-3);background:var(--surface-2)}
.top-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:all var(--t) var(--ease)}
.icon-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.icon-btn svg{width:19px;height:19px}
.role{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 6px 0 12px;height:44px}
.role label{font-size:12px;color:var(--ink-3);font-weight:600}
.role select{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;padding:6px 4px;outline:0}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(135deg,#2563eb,#7c3aed);flex:none;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line)}

.content{padding-block:28px 72px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;max-width:1400px;width:100%}
.content > *{animation:rise .45s var(--ease) both}
.content > *:nth-child(2){animation-delay:.04s}.content > *:nth-child(3){animation-delay:.08s}.content > *:nth-child(4){animation-delay:.12s}.content > *:nth-child(5){animation-delay:.16s}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head .sub{color:var(--ink-2);margin-top:6px;max-width:64ch}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero-band{background:var(--hero);color:#fff;border-radius:22px;padding:26px 28px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
.hero-band::after{content:"";position:absolute;right:-60px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%);pointer-events:none}
.hero-band h1{color:#fff}
.hero-band .eyebrow{color:rgba(255,255,255,.72)}
.hero-band .sub{color:rgba(255,255,255,.82);margin-top:6px}
.hero-band .actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.hero-band .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff}
.hero-band .btn:hover{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.5)}
.hero-band .btn.primary{background:#fff;color:#1e3a8a;border-color:#fff}
.hero-band .btn.primary:hover{background:#eaf1ff}

/* controls */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;min-height:42px;padding:0 16px;font-weight:700;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap;transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.btn:hover{border-color:var(--ink-3)}
.btn:active{opacity:.85}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px var(--accent-glow)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 10px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{min-height:34px;padding:0 12px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;min-height:34px;padding:0 14px;font-size:12.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:all var(--t) var(--ease)}
.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:34px;padding:0 14px;font-weight:600;font-size:12.5px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gray{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
select.btn{appearance:auto}

/* cards & grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;transition:box-shadow var(--t) var(--ease),border-color var(--t) var(--ease)}
.card-h{display:flex;align-items:center;gap:10px;padding:18px 20px 0;flex-wrap:wrap}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:14px 20px 20px}
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.stat{padding:18px 20px;display:flex;flex-direction:column;gap:6px;position:relative}
.stat:hover{box-shadow:var(--shadow-hover)}
.stat .v{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .d{font-size:12.5px;color:var(--ink-2)}
.stat .si{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.stat .si svg{width:18px;height:18px}
.stat .sp{margin-top:2px}
.up{color:var(--good);font-weight:700}
.down{color:var(--bad);font-weight:700}
.meter{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line-2)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.ico svg{width:18px;height:18px}
.ico.mail{background:color-mix(in srgb,var(--accent-2) 15%,transparent);color:var(--accent-2)}
.ico.warn{background:var(--warn-soft);color:var(--warn)}
.ico.good{background:var(--good-soft);color:var(--good)}
.ico.violet{background:color-mix(in srgb,var(--c3) 15%,transparent);color:var(--c3)}
.row-t{font-weight:700}
.row-m{font-size:12.5px;color:var(--ink-3)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink-2);font-size:13.5px;margin-top:3px}
.task{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line-2)}
.task:first-child{border-top:0}
.task .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent;background:var(--surface);transition:all var(--t)}
.task.done .box{background:var(--good);border-color:var(--good);color:#fff}
.task.done .tt{text-decoration:line-through;color:var(--ink-3)}
.task .tt{font-weight:600;font-size:13.5px}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:12px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle;transition:background-color var(--t)}
tr:last-child td{border-bottom:0}
tr.link:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.acct-name{font-weight:700;display:flex;flex-direction:column}
.acct-name small{font-weight:500;color:var(--ink-3);font-size:12px}
.acct-cell{display:flex;align-items:center;gap:12px}
.mini-logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:none}

/* account hero */
.acct-hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:22px}
.acct-logo{width:60px;height:60px;border-radius:18px;background:var(--hero);color:#fff;display:grid;place-items:center;font-size:21px;font-weight:800;box-shadow:0 8px 20px var(--accent-glow)}
.acct-hero .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-2);font-size:13px;margin-top:6px;align-items:center}
.acct-hero .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.kv div{padding:16px 22px;border-left:1px solid var(--line)}
.kv div:first-child{border-left:0}
.kv b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:38px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--line-2)}
.tl:first-child{border-top:0;padding-top:4px}
.tl .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl .body{color:var(--ink-2);margin-top:4px}
.tl .audio{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:4px 14px 4px 4px;width:fit-content;max-width:100%;font-size:12px;color:var(--ink-3)}
.tl .audio .play{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:0}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-3);font-weight:600}
.lock svg{width:12px;height:12px}
.wave-s{display:flex;gap:2px;align-items:center;height:18px}
.wave-s i{width:2px;border-radius:2px;background:var(--ink-3);opacity:.6}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 20px;overflow-x:auto}
.tab{background:none;border:0;min-height:48px;padding:0 12px;font-weight:700;font-size:13.5px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color var(--t)}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-color:var(--accent)}

/* charts */
svg text{font-family:var(--f-body)}
.chart-wrap{overflow-x:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* AI */
.ask{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:5px 5px 5px 14px;transition:border-color var(--t),box-shadow var(--t)}
.ask:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}
.ask input{flex:1;min-width:0;border:0;background:transparent;outline:0;font:inherit;color:var(--ink);min-height:34px}
.ai-answer{margin-top:12px;border-radius:14px;background:linear-gradient(180deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 40%,var(--surface)));border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);padding:16px;font-size:13.5px;color:var(--ink);display:flex;flex-direction:column;gap:8px}

.step.done,.step.now{color:var(--ink)}

.cmdk{width:min(620px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden;align-self:start;margin-top:10vh;animation:pop .2s var(--ease)}

/* ---------- small chart helpers ---------- */
function bars(vals, prior, w=640, h=270){
  const pad={l:44,r:12,t:12,b:44}; const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const max = 160000; const bw = iw/vals.length;
  const y = v => pad.t + ih - (v/max)*ih;
  const months=['Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov'];
  const calls=[1,1,0,2,1,1,2,1,1,2,2,3];
  let g='';
  [0,40000,80000,120000,160000].forEach(t=>{ g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line-2)"/><text x="${pad.l-8}" y="${y(t)+4}" text-anchor="end" font-size="10.5" fill="var(--ink-3)">${t?('$'+t/1000+'K'):'$0'}</text>`; });
  vals.forEach((v,i)=>{ const x=pad.l+i*bw+bw*0.18, bwi=bw*0.64; const last=i===vals.length-1;
    g+=`<rect x="${x}" y="${y(v)}" width="${bwi}" height="${pad.t+ih-y(v)}" rx="4" fill="${last?'var(--accent)':'color-mix(in srgb, var(--accent) 55%, transparent)'}"><title>${months[i]}: ${fmt$(v)}</title></rect>`;
    g+=`<text x="${x+bwi/2}" y="${h-pad.b+16}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)">${months[i]}</text>`;
    for(let k=0;k<calls[i];k++) g+=`<circle cx="${x+bwi/2 + (k-(calls[i]-1)/2)*8}" cy="${h-pad.b+32}" r="3" fill="var(--accent-2)"><title>${calls[i]} call(s) in ${months[i]}</title></circle>`;
  });
  const pts = prior.map((v,i)=>`${pad.l+i*bw+bw/2},${y(v)}`).join(' ');
  g+=`<polyline points="${pts}" fill="none" stroke="var(--ink-3)" stroke-width="1.6" stroke-dasharray="4 4"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="min-width:520px" role="img" aria-label="Monthly sales with calls logged">${g}</svg>`;
}
function spark(vals, color='var(--accent)', w=80, h=24){
  const mx=Math.max(...vals), mn=Math.min(...vals); const p=vals.map((v,i)=>`${(i/(vals.length-1))*w},${h-2-((v-mn)/(mx-mn||1))*(h-4)}`).join(' ');
  const lx=w, ly=h-2-((vals[vals.length-1]-mn)/(mx-mn||1))*(h-4);
  return `<svg width="${w}" height="${h}" viewBox="-2 0 ${w+4} ${h}" aria-hidden="true"><polyline points="${p}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${lx}" cy="${ly}" r="2.6" fill="${color}"/></svg>`;
}
function seeded(id,n,base,trend){ let s=0; for(const c of id) s=(s*31+c.charCodeAt(0))%9973; const out=[]; for(let i=0;i<n;i++){ s=(s*7919+17)%9973; out.push(base*(1+trend*i/n)+(s/9973-.5)*base*.35);} return out; }

/* ---------- interactions ---------- */
let toastT;
function toast(msg){ let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);} t.innerHTML=ic('check')+'<span>'+esc(msg)+'</span>'; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3200); }
function go(r){ if(location.hash==='#'+r) render(); else location.hash=r; }

document.addEventListener('click', e=>{
  if(e.target.closest('#layer .cmdk-list')) return;
  const el = e.target.closest('[data-acct],[data-go],[data-action],[data-toast],[data-typef],[data-repf],[data-site],[data-so],[data-tab],[data-pick],[data-recv],[data-fu]');
  if(!el) return;
  const d = el.dataset;
  if(d.acct){ S.acct=d.acct; S.tab='activity'; }
  if(d.so) S.so=d.so;
  if(d.typef){ S.typeF=d.typef; render(); return; }
  if(d.repf){ S.repF=d.repf; render(); return; }
  if(d.site){ S.site=d.site; render(); return; }
  if(d.tab){ S.tab=d.tab; render(); return; }
  if(d.pick){ S.picks[+d.pick]=!S.picks[+d.pick]; render(); return; }
  if(d.recv){ S.recv[+d.recv]=true; render(); toast('Received into bin. On-hand updated.'); return; }
  if(d.toast){ e.preventDefault(); toast(d.toast); return; }
  if(d.fu!==undefined){ S.fu[+d.fu]=!S.fu[+d.fu]; render(); return; }
  if(d.action==='cmdk'){ e.preventDefault(); openCmdk(); return; }
  if(d.action==='card'){ e.preventDefault(); openCard(); return; }
  if(d.action==='voice'){ e.preventDefault(); openVoice(); return; }
  if(d.action==='ask'){ e.preventDefault(); openAsk(); return; }
  if(d.action==='ask-inline'){ toast('Answers come from calls, emails, sales and inventory for this account.'); return; }
  if(d.action==='scan'){ const n=S.picks.indexOf(false); if(n>=0){S.picks[n]=true; render(); toast('Scanned. Bin and quantity confirmed.');} return; }
  if(d.action==='complete-pick'){ toast('SO-24117 packed. Accounting has it for invoicing.'); S.picks=[false,false,false]; render(); return; }
  if(d.go){ e.preventDefault(); go(d.go); return; }
  if(d.acct && el.tagName!=='A'){ go('account'); }
});
document.getElementById('role').addEventListener('change', e=>{ S.role=e.target.value; S.typeF='All'; const r=(location.hash||'').slice(1); if(!allowed(r)) go(home()); else render(); toast('Showing the app as '+e.target.selectedOptions[0].text+'. Menus change by role.'); });
document.addEventListener('keydown', e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openCmdk(); } if(e.key==='Escape') closeLayer(); });

/* ---------- command palette ---------- */
function openCmdk(){
  layer.innerHTML = `<div class="scrim" data-close><div class="cmdk" role="dialog" aria-modal="true" aria-label="Search">
    <div class="cmdk-in">${ic('search','width="18" height="18"')}<input id="cmdk-q" placeholder="Search accounts, SKUs, orders, or type a command" aria-label="Search" autocomplete="off"><span class="kbd">Esc</span></div>
    <div class="cmdk-list" id="cmdk-list"></div></div></div>`;
  const q=document.getElementById('cmdk-q'), list=document.getElementById('cmdk-list');
  const acts=[['mic','Log a call','voice'],['card','Scan a business card','card'],['spark','Ask TMA Hub','ask'],['digest','Open daily digest','#digest'],['map','Plan a trip','#map']];
  function paint(){
    const v=q.value.trim().toLowerCase();
    const a=ACCTS.filter(x=>!v||x.name.toLowerCase().includes(v)||x.city.toLowerCase().includes(v)).slice(0,5);
    const it=ITEMS.filter(x=>v&&(x.sku.toLowerCase().includes(v)||x.desc.toLowerCase().includes(v))).slice(0,3);
    const so=ORDERS.filter(x=>v&&x.so.toLowerCase().includes(v)).slice(0,3);
    const ac=acts.filter(x=>!v||x[1].toLowerCase().includes(v));
    list.innerHTML =
      (ac.length?`<div class="cmdk-g">Actions</div>${ac.map(x=>`<button class="cmdk-i" data-cmd="${x[2]}"><span class="ico">${ic(x[0])}</span><b>${x[1]}</b></button>`).join('')}`:'')+
      (a.length?`<div class="cmdk-g">Accounts</div>${a.map(x=>`<button class="cmdk-i" data-cmd="acct:${x.id}"><span class="mini-logo" style="background:${LOGO(x.id)}">${initials(x.name)}</span><span><b>${x.name}</b><div class="row-m">${x.city}, ${x.st} · ${x.type}</div></span><small class="num">${fmtK(x.ytd)}</small></button>`).join('')}`:'')+
      (it.length?`<div class="cmdk-g">Inventory</div>${it.map(x=>`<button class="cmdk-i" data-cmd="#inventory"><span class="ico">${ic('box')}</span><span><b>${x.desc}</b><div class="row-m mono">${x.sku}</div></span><small class="num">${x.on-x.com} avail</small></button>`).join('')}`:'')+
      (so.length?`<div class="cmdk-g">Orders</div>${so.map(x=>`<button class="cmdk-i" data-cmd="so:${x.so}"><span class="ico">${ic('orders')}</span><span><b class="mono">${x.so}</b><div class="row-m">${A(x.acct).name}</div></span><small>${STAGES[x.stage]}</small></button>`).join('')}`:'')+
      (!ac.length&&!a.length&&!it.length&&!so.length?`<p class="muted" style="padding:16px">No matches for "${esc(q.value)}". Try an account name, a SKU like TAC-007E, or an order like SO-24117.</p>`:'');
  }
  paint(); q.addEventListener('input',paint); setTimeout(()=>q.focus(),30);
  q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const f=list.querySelector('[data-cmd]'); if(f) f.click(); }});
  layer.querySelector('.scrim').addEventListener('click',e=>{ if(e.target.classList.contains('scrim')) closeLayer(); });
  list.addEventListener('click',e=>{ const b=e.target.closest('[data-cmd]'); if(!b) return; const c=b.dataset.cmd; closeLayer();
    if(c==='voice') openVoice(); else if(c==='card') openCard(); else if(c==='ask') openAsk();
    else if(c.startsWith('acct:')){ S.acct=c.slice(5); S.tab='activity'; go('account'); }
    else if(c.startsWith('so:')){ S.so=c.slice(3); go('orders'); }
    else go(c.slice(1)); });
}

/* ---------- business card ---------- */
function openCard(){
  layer.innerHTML = `<div class="scrim" data-close><div class="modal" role="dialog" aria-modal="true" aria-label="Scan a business card">
    <div class="modal-h"><div class="ico">${ic('card')}</div><div><h2>Scan a business card</h2><div class="row-m">Take a photo. The app reads it and files the contact.</div></div><button class="icon-btn x" data-x aria-label="Close">${ic('x')}</button></div>
    <div class="modal-b">
      <div class="grid g-2" style="align-items:center">
        <div class="cam" style="height:220px"><div class="bcard" style="width:78%"><span class="corner" style="top:-8px;left:-8px;border-right:0;border-bottom:0"></span><span class="corner" style="bottom:-8px;right:-8px;border-left:0;border-top:0"></span><b>Luis Ortega</b>Purchasing Manager<br><br><b style="font-size:12px">American Pipe &amp; Supply</b>2800 6th Ave S, Birmingham AL<br>(205) 555-0142 · luis.o@example.com</div><small>Card found · reading text</small></div>
        <div><div class="eyebrow" style="margin-bottom:6px">Read from the card</div>
          ${[['Name','Luis Ortega'],['Title','Purchasing Manager'],['Company','American Pipe Birmingham'],['Phone','(205) 555-0142'],['Email','luis.o@example.com']].map(f=>`<div class="field-row"><span>${f[0]}</span><b>${f[1]}</b></div>`).join('')}
        </div>
      </div>
      <div class="callout blue">${ic('link')}<span>Matched to the existing account <b>American Pipe Birmingham</b>. The contact is added there, and future emails from this address file to the account automatically.</span></div>
    </div>
    <div class="modal-f"><button class="btn" data-x>Retake</button><button class="btn primary" data-save>${ic('check')}Save contact</button></div>
  </div></div>`;
  layer.querySelector('.scrim').addEventListener('click',e=>{ if(e.target.classList.contains('scrim')) closeLayer(); });
  layer.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',closeLayer));
  layer.querySelector('[data-save]').addEventListener('click',()=>{ closeLayer(); toast('Luis Ortega added to American Pipe Birmingham.'); });
}

/* ---------- voice modal ---------- */
const layer = document.getElementById('layer');
let vt;
function closeLayer(){ clearInterval(vt); layer.innerHTML=''; }
const RAW = [
  ['Just left '], ['American Pipe Birmingham','ent'], [', talked with '], ['Dana Pruitt','ent'], [' at the counter. They want twenty-four more '], ['TACO 0015e3','ent'], [' circulators on the stock order before the cold snap. Pull-through on the Hoover Middle School job, three '], ['Centro-therm','fix'], [' '], ['InnoFlue 4" vent kits','ent'], [' from consignment. Follow up '], ['Friday','ent'], [' on the specialty piping quote.']
];
function openVoice(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const full = RAW.map(p=>p[0]).join('');
  let n = reduce? full.length : 0;
  layer.innerHTML = `<div class="scrim" data-close><div class="modal" role="dialog" aria-modal="true" aria-label="Log a call">
    <div class="modal-h"><div class="ico">${ic('mic')}</div><div><h2>Log a call</h2><div class="row-m">Live transcription · learns your team's product names</div></div><button class="icon-btn x" data-close aria-label="Close">${ic('x')}</button></div>
    <div class="modal-b">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
        <div class="seg" role="group" aria-label="How to log"><button class="on" type="button">${ic('mic','width="14" height="14" style="vertical-align:-2px"')} Speak</button><button type="button" data-vtoast="Type the note instead, for the office or a quiet room.">${ic('type','width="14" height="14" style="vertical-align:-2px"')} Type</button></div>
        <div class="field" style="flex:1;min-width:200px"><label for="logfor">Logging for</label><select id="logfor"><option>Myself (Marcus Bell)</option><option>Part-time rep: Dale Hutchins</option><option>Part-time rep: Renee Castle</option><option>Any rep (office staff)</option></select></div>
      </div>
      <div class="rec"><button class="rec-btn" id="recbtn" aria-label="Stop recording">${ic('mic','width="24" height="24"')}</button><div class="wave" id="wave">${Array.from({length:48},(_,i)=>`<i style="animation-delay:${(i%12)*-0.08}s;height:${30+((i*29)%70)}%"></i>`).join('')}</div><span class="num mono" id="rtime">0:00</span></div>
      <div class="field"><label>Transcript</label><div class="transcript" id="tx"></div></div>
      <div id="review" hidden>
        <div class="field"><label>Picked up from what you said</label>
          <div class="detect"><div><span class="eyebrow">Account</span><b>American Pipe Birmingham</b></div><div><span class="eyebrow">Contact</span><b>Dana Pruitt</b></div><div><span class="eyebrow">Follow-up task</span><b>Fri, Nov 13 · Quote Q-4471</b></div><div><span class="eyebrow">Products</span><b>TAC-0015E3-2F4 ×24 · CTH-ISVL0403 ×3</b></div></div></div>
        <div class="field" style="margin-top:14px"><label>Call type</label><div class="chips">${CALLTYPES.map(c=>`<button class="chip ${c==='Pull-through'?'on':''}" data-ct="${c}">${c}</button>`).join('')}</div></div>
        <div class="callout" style="margin-top:14px">${ic('alert')}<span><b>Check one word:</b> "Centro-therm" will be saved as <b>Centrotherm</b>, and the app remembers it for next time. Also, only <b>3</b> InnoFlue 4" kits are available in consignment.</span></div>
      </div>
    </div>
    <div class="modal-f"><span class="faint" style="font-size:12px;margin-right:auto">Audio is kept with the note so anyone can listen back.</span><button class="btn" data-close>Discard</button><button class="btn primary" id="savebtn" disabled>Review & save</button></div>
  </div></div>`;
  const tx = document.getElementById('tx'), rt=document.getElementById('rtime');
  function paint(){
    let left=n, html='';
    for(const [t,c] of RAW){ if(left<=0) break; const s=t.slice(0,left); left-=t.length; html += c? `<span class="${c}">${esc(s)}</span>` : esc(s); }
    tx.innerHTML = html + (n<full.length?'<span class="caret"></span>':'');
    const secs=Math.floor(n/9); rt.textContent = `${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;
  }
  function finish(){ clearInterval(vt); n=full.length; paint(); document.getElementById('wave').classList.add('stop'); const b=document.getElementById('recbtn'); b.classList.add('paused'); b.setAttribute('aria-label','Recording stopped'); document.getElementById('review').hidden=false; const s=document.getElementById('savebtn'); s.disabled=false; s.textContent='Save to account'; }
  paint();
  if(reduce) finish(); else vt=setInterval(()=>{ n+=3; paint(); if(n>=full.length) finish(); },30);
  document.getElementById('recbtn').onclick = finish;
  layer.querySelector('.modal').addEventListener('click',ev=>{ const vt2=ev.target.closest('[data-vtoast]'); if(vt2) toast(vt2.dataset.vtoast); const c=ev.target.closest('[data-ct]'); if(c){ layer.querySelectorAll('[data-ct]').forEach(x=>x.classList.toggle('on',x===c)); } });
  document.getElementById('savebtn').onclick = ()=>{ closeLayer(); toast('Call saved to American Pipe Birmingham with audio and a Friday follow-up.'); };
  layer.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',ev=>{ if(ev.target===el || el.classList.contains('btn') || el.classList.contains('icon-btn')) closeLayer(); }));
}

/* ---------- ask drawer ---------- */
function openAsk(){
  const a = A(S.acct);
  layer.innerHTML = `<div class="scrim" data-close style="background:rgba(5,12,30,.35)"></div><aside class="drawer" role="dialog" aria-label="Ask TMA Hub">
    <div class="modal-h"><div class="ico">${ic('spark')}</div><div><h2>Ask TMA Hub</h2><div class="row-m">Answers from your calls, emails, sales and stock</div></div><button class="icon-btn x" data-close aria-label="Close">${ic('x')}</button></div>
    <div class="modal-b" style="gap:10px">
      <div class="msg me">I'm in Mobile Thursday. Who should Kendra see and why?</div>
      <div class="msg ai">Three stops, in this order:<ul><li><b>Port City Plumbing Supply</b>: sales down 5% despite 11 calls. Direct-ship PO-8814 landed last week, a good opener.</li><li><b>Emerald Coast Supply</b> (Pensacola, 1 hr): up 15%, SO-24118 ready for pickup.</li><li><b>Gulf South Mechanical</b>: 13 calls, sales down 24%. Keep it short.</li></ul><div class="cite" style="margin-top:6px">Sources: Power BI sales · 31 calls · 2 orders</div></div>

}

render();
})();
</script>
